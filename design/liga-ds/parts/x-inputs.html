<section class="sec" id="inputs" data-title="Text inputs">
  <h2 class="t-title">Text inputs</h2>
  <p class="lead">Filled, no border, 48 px, 16 px text (no zoom on iOS). Focus is a 2 px text-colour ring. Errors get a red ring and a message below, never only colour.</p>
  <div class="demo form-grid">
    <div class="field"><label for="i1">Display name</label><input id="i1" class="input" value="Dave"><span class="hint">Shown on the leaderboard</span></div>
    <div class="field"><label for="i2">League name</label><input id="i2" class="input invalid" value=""><span class="err"><i data-lucide="alert-circle"></i>Give the league a name</span></div>
    <div class="field"><label>Search</label><div class="search"><i data-lucide="search"></i><input class="input" placeholder="Find a player"></div></div>
    <div class="field"><label for="i4">Sport</label><div class="select-wrap"><select id="i4" class="input select"><option>Foosball</option><option>Table tennis</option><option>Pool</option><option>Darts</option></select><i data-lucide="chevron-down"></i></div></div>
    <div class="field" style="grid-column:1/-1"><label for="i5">Note</label><textarea id="i5" class="input" placeholder="Anything worth remembering?"></textarea></div>
  </div>
</section>
