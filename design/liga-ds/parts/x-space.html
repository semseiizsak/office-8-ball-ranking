<section class="sec" id="space" data-title="Spacing and radius">
  <h2 class="t-title">Spacing and radius</h2>
  <p class="lead">4 px base. Dense, like a feed: cards use 16 px padding, sheets 20 px, the screen gutter is 16 px. Corners get rounder as the surface gets bigger.</p>
  <div class="two">
    <div class="spacing" id="spacing"></div>
    <div class="radii">
      <div class="rad"><i style="border-radius:var(--r-xs)"></i><b>8 xs</b><span>Menu items, small tags</span></div>
      <div class="rad"><i style="border-radius:var(--r-sm)"></i><b>12 sm</b><span>Inputs, tiles</span></div>
      <div class="rad"><i style="border-radius:var(--r-md)"></i><b>16 md</b><span>Cards, lists, toasts</span></div>
      <div class="rad"><i style="border-radius:var(--r-lg)"></i><b>24 lg</b><span>Sheets, dialogs, hero cards</span></div>
      <div class="rad"><i style="border-radius:var(--r-pill)"></i><b>Pill</b><span>Buttons, chips, tab bar</span></div>
    </div>
  </div>
</section>
