<section class="sec" id="badges" data-title="Badges and tiers">
  <h2 class="t-title">Badges and tiers</h2>
  <p class="lead">Badges are big emoji, standing free, with a name and how many players have it. Locked badges are grey. Tiered achievements use the five medal colours.</p>
  <div class="demo">
    <div class="badge-grid">
      <div class="badge-tile"><span class="em">🎩</span><b>Hat Trick</b><span>4 players</span></div>
      <div class="badge-tile"><span class="em">🗡️</span><b>Giant Killer</b><span>Only you</span></div>
      <div class="badge-tile"><span class="em">🦆</span><b>The Duck</b><span>2 players</span></div>
      <div class="badge-tile locked"><span class="em">👻</span><b>???</b><span>Nobody yet</span></div>
    </div>
    <div class="card" style="max-width:420px">
      <div class="row-wrap" style="flex-wrap:nowrap;gap:14px"><span class="medal silver">🏓</span><div style="flex:1"><b class="t-body-strong" style="font:var(--t-body-strong)">Regular</b><p class="t-small">Next: Gold at 150 matches</p><div class="bar gold" style="margin-top:8px"><i style="width:56%"></i></div></div><span class="t-num">84</span></div>
    </div>
  </div>
</section>
